<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NSE Stocks Screener</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .bullish { color: green; font-weight: bold; }
    .bearish { color: red; font-weight: bold; }
    .sideways { color: orange; font-weight: bold; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>NSE Stocks Screener (MWD RSI)</h1>
  <label for="filter">Filter:</label>
  <select id="filter">
    <option value="nifty50">Nifty 50</option>
    <option value="nifty200">Nifty 200</option>
    <option value="nifty500">Nifty 500</option>
  </select>

  <table id="stocksTable">
    <thead>
      <tr>
        <th>Stock</th>
        <th>MWD RSI</th>
        <th>Signal</th>
        <th>% Change Daily</th>
        <th>% Change Weekly</th>
        <th>% Change Monthly</th>
        <th>% Change 3-Month</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // Example data (replace with live API or CSV)
    const stocks = [
      {name:"RELIANCE", rsi:65, daily:1.2, weekly:3.5, monthly:5.0, threeMonth:12.0},
      {name:"INFY", rsi:35, daily:-0.5, weekly:-2.0, monthly:-4.0, threeMonth:-8.0},
      {name:"HDFC", rsi:50, daily:0.2, weekly:1.0, monthly:2.0, threeMonth:3.5}
    ];

    function getSignal(rsi) {
      if(rsi > 60) return {text:"Bullish", class:"bullish"};
      if(rsi < 40) return {text:"Bearish", class:"bearish"};
      return {text:"Sideways", class:"sideways"};
    }

    const tbody = document.querySelector("#stocksTable tbody");
    stocks.forEach(s => {
      const sig = getSignal(s.rsi);
      const row = `<tr>
        <td>${s.name}</td>
        <td>${s.rsi}</td>
        <td class="${sig.class}">${sig.text}</td>
        <td>${s.daily}%</td>
        <td>${s.weekly}%</td>
        <td>${s.monthly}%</td>
        <td>${s.threeMonth}%</td>
      </tr>`;
      tbody.innerHTML += row;
    });
  </script>
</body>
</html>
