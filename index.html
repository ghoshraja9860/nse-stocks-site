<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NSE Stock Screener</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 0; }
    header {
      background: linear-gradient(to right, #004d99, #00b3b3);
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 28px; }
    header p { margin: 5px 0 10px; font-size: 16px; }
    .banner-links { margin-top: 10px; }
    .banner-links a {
      display: inline-block;
      margin: 5px;
      padding: 8px 14px;
      background: #fff;
      color: #004d99;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 14px;
      transition: background 0.2s, color 0.2s;
    }
    .banner-links a:hover { background: #004d99; color: #fff; }
    .controls { margin: 20px; }
    .summary { margin: 20px; font-size: 16px; font-weight: bold; }
    .stock-card {
      width: 260px;
      margin: 10px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s;
      cursor: pointer;
      display: inline-block;
      vertical-align: top;
    }
    .stock-card:hover { transform: scale(1.03); }
    .bullish { background: linear-gradient(to bottom right, #d4fdd4, #b2f2b2); border-left: 6px solid green; }
    .bearish { background: linear-gradient(to bottom right, #ffd6d6, #ffb3b3); border-left: 6px solid red; }
    .sideways { background: linear-gradient(to bottom right, #fff3c2, #ffe999); border-left: 6px solid orange; }
    .stock-card h3 { margin: 0 0 8px; }
    .stock-card p { margin: 4px 0; font-size: 14px; }
    .details { display: none; margin-top: 10px; font-size: 13px; }
    .details p { margin: 3px 0; }
    .positive { color: green; }
    .negative { color: red; }
  </style>
</head>
<body>
  <header>
    <h1>AGNI Trading Channel</h1>
    <p>Smart NSE Stock Screener | RSI + Trend Analysis | Powered by TradingView</p>
    <div class="banner-links">
      <a href="https://youtube.com/@technofundatraders?si=1WdULL8y4w4aMz73" target="_blank">📺 YouTube</a>
      <a href="https://t.me/technofundatrader" target="_blank">📢 Telegram</a>
    </div>
  </header>

  <div class="controls">
    <label for="filter">Sector:</label>
    <select id="filter">
      <option value="all">All Sectors</option>
      <option value="financials">Financials</option>
      <option value="healthcare">Healthcare</option>
      <option value="industrials">Industrials</option>
      <option value="i.t">IT</option>
      <option value="services">Services</option>
      <option value="auto">Auto</option>
      <option value="fmcg">FMCG</option>
      <option value="miscellaneous">Miscellaneous</option>
      <option value="realty">Realty</option>
      <option value="transportation">Transportation</option>
      <option value="consumer discretionary">Consumer Discretionary</option>
      <option value="metals & mining">Metals & Mining</option>
      <option value="telecom-service">Telecom</option>
      <option value="aerospace & defence">Aerospace & Defence</option>
    </select>

    <label for="signal">Signal:</label>
    <select id="signal">
      <option value="all">All</option>
      <option value="bullish">Bullish</option>
      <option value="bearish">Bearish</option>
      <option value="sideways">Sideways</option>
    </select>
  </div>

  <div class="summary" id="summaryCounts">
    Bullish: 0 | Bearish: 0 | Sideways: 0
  </div>

  <div id="stocksContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
    async function loadCSV() {
      const response = await fetch('https://raw.githubusercontent.com/ghoshraja9860/nse-stocks-site/main/Rsi.csv');
      const text = await response.text();
      const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
      const rows = parsed.data;

      const container = document.getElementById("stocksContainer");
      const filterSelect = document.getElementById("filter");
      const signalSelect = document.getElementById("signal");
      const summaryDiv = document.getElementById("summaryCounts");

      function render(sectorFilter, signalFilter) {
        container.innerHTML = "";
        let bullishCount = 0, bearishCount = 0, sidewaysCount = 0;

        rows.forEach(row => {
          const { symbol, cmp, dRSI, wRSI, mRSI, sector, latestChange, weeklyChange, monthlyChange } = row;
          if (!symbol) return;

          const avgRSI = ((parseFloat(mRSI) + parseFloat(wRSI) + parseFloat(dRSI)) / 3).toFixed(1);

          let signalClass, signalText;
          if (parseFloat(avgRSI) > 60) { signalClass="bullish"; signalText="Bullish"; bullishCount++; }
          else if (parseFloat(avgRSI) < 40) { signalClass="bearish"; signalText="Bearish"; bearishCount++; }
          else { signalClass="sideways"; signalText="Sideways"; sidewaysCount++; }

          if (sectorFilter !== "all" && sector.toLowerCase() !== sectorFilter.toLowerCase()) return;
          if (signalFilter !== "all" && signalClass !== signalFilter) return;

          function formatChange(val) {
            const num = parseFloat(val);
            if (isNaN(num)) return val;
            return `<span class="${num >= 0 ? 'positive' : 'negative'}">${num}%</span>`;
          }

          const card = document.createElement("div");
          card.className = `stock-card ${signalClass}`;
          card.innerHTML = `
            <h3>${symbol}</h3>
            <p>Sector: ${sector}</p>
            <p><strong>${signalText}</strong></p>
            <div class="details" style="display:none;">
              <p>CMP: ${cmp}</p>
              <p>% Latest Change: ${formatChange(latestChange)}</p>
              <p>% Weekly Change: ${formatChange(weeklyChange)}</p>
              <p>% Monthly Change: ${formatChange(monthlyChange)}</p>
              <p>Daily RSI: ${dRSI}</p>
              <p>Weekly RSI: ${wRSI}</p>
              <p>Monthly RSI: ${mRSI}</p>
              <a class="tradingview-link" href="https://www.tradingview.com/symbols/NSE-${symbol}/" target="_blank">
                Open Full Chart
              </a>
            </div>
          `;
          card.addEventListener("click", () => {
            const details = card.querySelector(".details");
            

            details.style.display = details.style.display === "none" ? "block" : "none";

            
              });
              
          container.appendChild(card);
        });

        summaryDiv.textContent = `Bullish: ${bullishCount} | Bearish: ${bearishCount} | Sideways: ${sidewaysCount}`;
      }

      // attach filter listeners
      filterSelect.addEventListener("change", () => render(filterSelect.value, signalSelect.value));
      signalSelect.addEventListener("change", () => render(filterSelect.value, signalSelect.value));

      // initial render
      render("all", "all");
    }

    // run loader
    loadCSV();
  </script>
</body>
</html>
