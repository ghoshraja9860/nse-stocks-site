<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NSE Stock Screener</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .bullish { color: green; font-weight: bold; }
    .bearish { color: red; font-weight: bold; }
    .sideways { color: orange; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>NSE Stock Screener (MWD RSI)</h1>

  <label for="filter">Filter:</label>
  <select id="filter">
    <option value="all">All Stocks</option>
    <option value="nifty50">Nifty 50</option>
    <option value="nifty200">Nifty 200</option>
    <option value="nifty500">Nifty 500</option>
  </select>

  <table id="stocksTable">
    <thead>
      <tr>
        <th>Stock</th>
        <th>Monthly RSI</th>
        <th>Weekly RSI</th>
        <th>Daily RSI</th>
        <th>MWD RSI</th>
        <th>Signal</th>
        <th>% Daily</th>
        <th>% Weekly</th>
        <th>% Monthly</th>
        <th>% 3-Month</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadCSV() {
      // Use raw GitHub URL for CSV
      const response = await fetch('https://raw.githubusercontent.com/ghoshraja9860/nse-stocks-site/main/stocks.csv');
      const text = await response.text();
      const rows = text.trim().split('\n').slice(1); // skip header

      const tbody = document.querySelector("#stocksTable tbody");
      const filterSelect = document.getElementById("filter");

      function render(filter) {
        tbody.innerHTML = "";
        rows.forEach(row => {
          const cols = row.split(',');
          if (cols.length < 9) return; // skip bad rows

          // Extract values
          const [stock, mRSI, wRSI, dRSI, daily, weekly, monthly, threeMonth, universe] = cols.map(c => c.trim());

          // Auto-calc MWD RSI
          const mwdRSI = ((parseFloat(mRSI) + parseFloat(wRSI) + parseFloat(dRSI)) / 3).toFixed(1);

          // Filter by universe
          if (filter !== "all" && universe !== filter) return;

          // Signal logic
          let signalClass, signalText;
          if (parseFloat(mwdRSI) > 60) { signalClass="bullish"; signalText="Bullish"; }
          else if (parseFloat(mwdRSI) < 40) { signalClass="bearish"; signalText="Bearish"; }
          else { signalClass="sideways"; signalText="Sideways"; }

          // Build row
          const tr = `<tr>
            <td>${stock}</td><td>${mRSI}</td><td>${wRSI}</td><td>${dRSI}</td>
            <td>${mwdRSI}</td><td class="${signalClass}">${signalText}</td>
            <td>${daily}%</td><td>${weekly}%</td><td>${monthly}%</td><td>${threeMonth}%</td>
          </tr>`;
          tbody.innerHTML += tr;
        });
      }

      filterSelect.addEventListener("change", () => render(filterSelect.value));
      render("all");
    }

    loadCSV();
  </script>
</body>
</html>
