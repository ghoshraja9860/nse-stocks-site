<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NSE Stock Screener</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 0; }
    header {
      background: linear-gradient(to right, #004d99, #00b3b3);
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 28px; }
    header p { margin: 5px 0 0; font-size: 16px; }
    .controls { margin: 20px; }
    .stock-card {
      width: 240px;
      margin: 10px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s;
      cursor: pointer;
      display: inline-block;
      vertical-align: top;
    }
    .stock-card:hover { transform: scale(1.03); }
    .bullish { background: linear-gradient(to bottom right, #d4fdd4, #b2f2b2); border-left: 6px solid green; }
    .bearish { background: linear-gradient(to bottom right, #ffd6d6, #ffb3b3); border-left: 6px solid red; }
    .sideways { background: linear-gradient(to bottom right, #fff3c2, #ffe999); border-left: 6px solid orange; }
    .stock-card h3 { margin: 0 0 8px; }
    .stock-card p { margin: 4px 0; font-size: 14px; }
    .tradingview-link {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      background: #004d99;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 13px;
    }
    .tradingview-link:hover { background: #007acc; }
  </style>
</head>
<body>
  <!-- Banner -->
  <header>
    <h1>Trade With Agni(TechnoFunda Traders)</h1>
    <p>Smart NSE Stock Screener | Trend Analysis | Powered by TradingView</p>
  </header>

  <!-- Filters -->
  <div class="controls">
    <label for="filter">Sector:</label>
    <select id="filter">
      <option value="all">All Sectors</option>
      <option value="financials">Financials</option>
      <option value="healthcare">Healthcare</option>
      <option value="industrials">Industrials</option>
      <option value="i.t">IT</option>
      <option value="services">Services</option>
      <option value="auto">Auto</option>
      <option value="fmcg">FMCG</option>
      <option value="miscellaneous">Miscellaneous</option>
      <option value="realty">Realty</option>
      <option value="transportation">Transportation</option>
      <option value="consumer discretionary">Consumer Discretionary</option>
      <option value="metals & mining">Metals & Mining</option>
      <option value="telecom-service">Telecom</option>
      <option value="aerospace & defence">Aerospace & Defence</option>
    </select>

    <label for="signal">Signal:</label>
    <select id="signal">
      <option value="all">All</option>
      <option value="bullish">Bullish</option>
      <option value="bearish">Bearish</option>
      <option value="sideways">Sideways</option>
    </select>
  </div>

  <!-- Stock Cards -->
  <div id="stocksContainer"></div>

  <script>
    async function loadCSV() {
      const response = await fetch('https://raw.githubusercontent.com/ghoshraja9860/nse-stocks-site/main/Rsi.csv');
      const text = await response.text();
      const rows = text.trim().split('\n').slice(1);

      const container = document.getElementById("stocksContainer");
      const filterSelect = document.getElementById("filter");
      const signalSelect = document.getElementById("signal");

      function render(sectorFilter, signalFilter) {
        container.innerHTML = "";
        rows.forEach(row => {
          const cols = row.split(',').map(c => c.replace(/(^"|"$)/g,'').trim());
          if (cols.length < 13) return;

          const [, symbol, , , dRSI, wRSI, mRSI, sector] = cols;

          const mwdRSI = ((parseFloat(mRSI) + parseFloat(wRSI) + parseFloat(dRSI)) / 3).toFixed(1);

          let signalClass, signalText;
          if (parseFloat(mwdRSI) > 60) { signalClass="bullish"; signalText="Bullish"; }
          else if (parseFloat(mwdRSI) < 40) { signalClass="bearish"; signalText="Bearish"; }
          else { signalClass="sideways"; signalText="Sideways"; }

          if (sectorFilter !== "all" && sector.toLowerCase() !== sectorFilter.toLowerCase()) return;
          if (signalFilter !== "all" && signalClass !== signalFilter) return;

          const card = document.createElement("div");
          card.className = `stock-card ${signalClass}`;
          card.innerHTML = `
            <h3>${symbol}</h3>
            <p><strong>${signalText}</strong></p>
            <p>Sector: ${sector}</p>
            <a class="tradingview-link" href="https://www.tradingview.com/symbols/NSE-${symbol}/" target="_blank">
              View on TradingView
            </a>
          `;
          container.appendChild(card);
        });
      }

      filterSelect.addEventListener("change", () => render(filterSelect.value, signalSelect.value));
      signalSelect.addEventListener("change", () => render(filterSelect.value, signalSelect.value));
      render("all", "all");
    }

    loadCSV();
  </script>
</body>
</html>
